name: Build Windows app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean ElDescargador.spec

      - name: Create distribution archive
        shell: pwsh
        run: Compress-Archive -Path dist/ElDescargador/* -DestinationPath ElDescargador-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElDescargador-windows-x64
          path: ElDescargador-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: ElDescargador-windows-x64

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" ElDescargador-windows-x64.zip --generate-notes
